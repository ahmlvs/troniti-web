<svg width="1128" height="191" viewBox="0 0 1128 191" xmlns="http://www.w3.org/2000/svg">
  <!-- LinkedIn company cover (1128x191; render PNG at 2x for sharpness):
       node -e "require('sharp')('design/brand/linkedin-banner.svg',{density:200}).resize(2256,382).png().toFile('design/brand/linkedin-banner.png')" -->
  <defs>
    <radialGradient id="glow" cx="18%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#f7941d" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#f7941d" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: Menlo, "SFMono-Regular", monospace; }
    </style>
  </defs>

  <rect width="1128" height="191" fill="#0d0f14"/>
  <rect width="1128" height="191" fill="url(#glow)"/>

  <!-- wordmark, left -->
  <g transform="translate(64,60) scale(0.72)">
    <g transform="rotate(-20 50 50)">
      <ellipse cx="50" cy="50" rx="34" ry="16" fill="none" stroke="#52525b" stroke-width="5"/>
      <circle cx="50" cy="50" r="8.5" fill="#f7941d"/>
      <circle cx="84" cy="50" r="6" fill="#f4f4f5"/>
      <circle cx="16" cy="50" r="6" fill="#f9a63f"/>
    </g>
  </g>
  <text x="152" y="111" class="sans" font-size="42" font-weight="700" fill="#f4f4f5">troniti</text>

  <!-- the category + the figure, right -->
  <text x="1064" y="86" class="mono" font-size="23" text-anchor="end" xml:space="preserve"><tspan fill="#22c55e">$</tspan><tspan fill="#a1a1aa"> non-custodial TRON yield operator</tspan></text>
  <text x="1064" y="126" class="mono" font-size="20" text-anchor="end" xml:space="preserve"><tspan font-weight="700" fill="#f7941d">~15%</tspan><tspan fill="#a1a1aa"> combined TRX yield · voting + energy rental</tspan></text>
</svg>
