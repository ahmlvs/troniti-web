<svg width="1500" height="500" viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- X (Twitter) header for the tronitiapp profile, 1500x500. The circular
       avatar overlays the lower-left on profile pages — content stays centered,
       no wordmark (the avatar carries the mark). Regenerate:
       node -e "require('sharp')('design/brand/x-banner-troniti.svg',{density:200}).resize(1500,500).png().toFile('design/brand/x-banner-troniti.png')" -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#f7941d" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#f7941d" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: Menlo, "SFMono-Regular", monospace; }
    </style>
  </defs>

  <rect width="1500" height="500" fill="#0d0f14"/>
  <rect width="1500" height="500" fill="url(#glow)"/>

  <text x="830" y="185" class="mono" font-size="34" text-anchor="middle" xml:space="preserve"><tspan fill="#22c55e">$</tspan><tspan fill="#a1a1aa"> non-custodial TRON yield operator</tspan></text>

  <text x="830" y="285" class="sans" font-size="76" font-weight="800" text-anchor="middle" xml:space="preserve"><tspan fill="#f4f4f5">Earn the </tspan><tspan fill="#f7941d">maximum</tspan><tspan fill="#f4f4f5"> on your TRX.</tspan></text>

  <text x="830" y="365" class="mono" font-size="30" text-anchor="middle" xml:space="preserve"><tspan font-weight="700" fill="#f7941d">~15%</tspan><tspan fill="#a1a1aa"> combined TRX yield · voting + energy rental</tspan></text>
</svg>
