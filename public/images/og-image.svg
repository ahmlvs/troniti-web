<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- The hero, as a card: ink field + faint brand glow, the category eyebrow, the
       headline with the accent word, the keys line and the figure. Regenerate the
       PNG after editing:
       node -e "require('sharp')('public/images/og-image.svg',{density:200}).resize(1200,630).png().toFile('public/images/og-image.png')" -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#f7941d" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#f7941d" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: Menlo, "SFMono-Regular", monospace; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#0d0f14"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="1197" height="627" fill="none" stroke="#27272a" stroke-width="3"/>

  <!-- wordmark, as in the site header -->
  <g transform="translate(72,58) scale(0.52)">
    <g transform="rotate(-20 50 50)">
      <ellipse cx="50" cy="50" rx="34" ry="16" fill="none" stroke="#52525b" stroke-width="5"/>
      <circle cx="50" cy="50" r="8.5" fill="#f7941d"/>
      <circle cx="84" cy="50" r="6" fill="#f4f4f5"/>
      <circle cx="16" cy="50" r="6" fill="#f9a63f"/>
    </g>
  </g>
  <text x="130" y="96" class="sans" font-size="34" font-weight="700" fill="#f4f4f5">troniti</text>

  <!-- live chip, as in the site header -->
  <rect x="252" y="67" width="192" height="34" rx="17" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
  <circle cx="274" cy="84" r="4" fill="#22c55e"/>
  <text x="288" y="90" class="mono" font-size="15" fill="#a1a1aa">live on mainnet</text>

  <!-- Connect wallet button, right side of the header -->
  <rect x="928" y="60" width="200" height="48" rx="10" fill="#f7941d"/>
  <text x="1028" y="91" class="sans" font-size="21" font-weight="600" fill="#0d0f14" text-anchor="middle">Connect wallet</text>

  <!-- the hero stack, centered -->
  <text x="600" y="204" class="mono" font-size="28" fill="#a1a1aa" text-anchor="middle" xml:space="preserve"><tspan fill="#22c55e">$</tspan><tspan> non-custodial TRON yield operator</tspan></text>

  <text x="600" y="308" class="sans" font-size="84" font-weight="800" text-anchor="middle" xml:space="preserve"><tspan fill="#f4f4f5">Earn the </tspan><tspan fill="#f7941d">maximum</tspan></text>
  <text x="600" y="400" class="sans" font-size="84" font-weight="800" fill="#f4f4f5" text-anchor="middle">on your TRX.</text>

  <text x="600" y="470" class="sans" font-size="27" text-anchor="middle" xml:space="preserve"><tspan fill="#f4f4f5">Keep your keys</tspan><tspan fill="#a1a1aa"> — the permission can never move your funds.</tspan></text>

  <text x="600" y="566" class="mono" text-anchor="middle" xml:space="preserve"><tspan font-size="54" font-weight="700" fill="#f7941d">~15%</tspan><tspan font-size="26" fill="#a1a1aa">  combined TRX yield · voting + energy rental</tspan></text>
</svg>
