<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Brand banner style: black terminal on orange (design/brand.md). On-orange
       text is ink, never white. Regenerate the PNG after editing:
       node -e "require('sharp')('public/images/og-image.svg',{density:200}).resize(1200,630).png().toFile('public/images/og-image.png')" -->
  <defs>
    <style>
      .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: Menlo, "SFMono-Regular", monospace; }
    </style>
  </defs>

  <!-- orange field -->
  <rect width="1200" height="630" fill="#f7941d"/>

  <!-- top band: the favicon tile (dark tile keeps the mark's real colors on the
       orange field) + wordmark left, category right (ink on orange) -->
  <g transform="translate(72,56)">
    <rect width="56" height="56" rx="12.3" fill="#16181d"/>
    <g transform="scale(0.56)">
      <g transform="rotate(-20 50 50)">
        <ellipse cx="50" cy="50" rx="32" ry="15" fill="none" stroke="#8a8a94" stroke-width="6"/>
        <circle cx="50" cy="50" r="9" fill="#f7941d"/>
        <circle cx="82" cy="50" r="7" fill="#f4f4f5"/>
        <circle cx="18" cy="50" r="7" fill="#f9a63f"/>
      </g>
    </g>
  </g>
  <text x="144" y="100" class="sans" font-size="42" font-weight="800" fill="#0d0f14">troniti</text>
  <text x="1128" y="96" class="mono" font-size="26" font-weight="700" fill="#0d0f14" text-anchor="end">$ non-custodial TRON yield operator</text>

  <!-- the terminal window -->
  <rect x="72" y="150" width="1056" height="416" rx="20" fill="#0d0f14"/>
  <line x1="72" y1="206" x2="1128" y2="206" stroke="#27272a" stroke-width="2"/>
  <circle cx="108" cy="178" r="7" fill="#ef4444" fill-opacity="0.7"/>
  <circle cx="132" cy="178" r="7" fill="#facc15" fill-opacity="0.7"/>
  <circle cx="156" cy="178" r="7" fill="#22c55e" fill-opacity="0.7"/>
  <text x="184" y="186" class="mono" font-size="22" fill="#a1a1aa">yield breakdown</text>

  <!-- the tree -->
  <text x="120" y="268" class="mono" font-size="34" xml:space="preserve">
    <tspan fill="#22c55e">$</tspan><tspan fill="#f4f4f5"> staked TRX</tspan>
  </text>

  <text x="120" y="330" class="mono" font-size="34" xml:space="preserve">
    <tspan fill="#a1a1aa">├── </tspan><tspan fill="#f4f4f5">votes</tspan><tspan fill="#a1a1aa"> → voting rewards</tspan>
  </text>
  <text x="1080" y="330" class="mono" font-size="34" fill="#f4f4f5" text-anchor="end">~3.3%</text>

  <text x="120" y="392" class="mono" font-size="34" xml:space="preserve">
    <tspan fill="#a1a1aa">└── </tspan><tspan fill="#f4f4f5">energy</tspan><tspan fill="#a1a1aa"> → rented out</tspan>
  </text>
  <text x="1080" y="392" class="mono" font-size="34" font-weight="700" fill="#f7941d" text-anchor="end">~11.9%</text>

  <line x1="120" y1="428" x2="1080" y2="428" stroke="#27272a" stroke-width="2"/>

  <text x="120" y="500" class="mono" font-size="40" font-weight="700" xml:space="preserve">
    <tspan fill="#f4f4f5">your wallet </tspan><tspan fill="#22c55e">▮</tspan>
  </text>
  <text x="1080" y="500" class="mono" font-size="44" font-weight="700" fill="#f7941d" text-anchor="end">~15%</text>
</svg>
